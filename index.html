<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Roupas</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ================= TOPO / BANNER ================= -->
  <header class="topo">
    <img 
      src="img/black titulo.jpg" 
      alt="fundo catalogo" 
      class="fundo titulo"
    >
  </header>

  <!-- ================= PESQUISA ================= -->
  <div class="pesquisa">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Pesquisar código"
    >
    <button id="btnSearch" aria-label="Pesquisar">🔍</button>
  </div>

  <!-- ================= CATÁLOGO ================= -->
  <section class="galeria" id="galeria"></section>

  <!-- ================= MODAL ================= -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>

      <img id="modalImg">
      <h2 id="modalNome"></h2>
      <p id="modalPreco"></p>
      <p id="modalDesc"></p>
    </div>
  </div>

</body>
</html>
